# Render Blueprint for the FitMind AI backend.
# In Render: New + -> Blueprint -> connect this repo. Render reads this file,
# creates the service, and prompts for the secret env vars (sync: false).
services:
  - type: web
    name: fitmind-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_ENV
        value: production
      # Secrets — set these in the Render dashboard (never committed).
      - key: MONGODB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Fernet key that encrypts health data at rest. Production refuses to
      # start without it. Generate one with:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Keep it safe: losing it makes stored health data unreadable.
      - key: HEALTH_DATA_KEY
        sync: false
      # Comma-separated production frontend origin(s) for CORS, e.g.
      # https://fitmind.vercel.app
      - key: CORS_EXTRA_ORIGINS
        sync: false
      # Cloudflare R2 object storage (voice check-in audio).
      - key: CLOUDFLARE_R2_URL
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      # Models and limits. Defaults live in app/config/settings.py; set these
      # only to override them.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: AI_DAILY_QUOTA
        value: "150"
