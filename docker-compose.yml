# Local dev stack with hot reload: `docker compose up --build` (or `npm run docker`).
# Backend secrets are read from backend/.env.local if it exists.
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      # Bind-mount file events don't reach the container reliably on Windows/macOS.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep Linux node_modules inside the container, separate from the host's.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
